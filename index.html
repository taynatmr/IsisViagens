<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<title>ISIS — Planner de Viagens</title>
<style>
:root{--bg:#fdf6fa;--card:#fff;--tx:#3d3a5c;--mu:#7a7896;--bd:#f1e1ea;--ac:#e58ab0;--onac:#3d2a4a;--s1:#f8c8dc;--s2:#bcd9f6;--stx:#3d3a5c;--hv:rgba(255,255,255,.65);--pill:#e3effc;--pt:#3b6ea5;--ok:#2b8a3e;--ko:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1824;--card:#26223a;--tx:#f1ebf6;--mu:#a9a3bd;--bd:#38314f;--ac:#f19bbb;--onac:#20121f;--s1:#4a2f48;--s2:#2c3e5e;--stx:#f3e9f5;--hv:rgba(255,255,255,.14);--pill:#33415f;--pt:#bcd9f6}}
:root[data-theme="dark"]{--bg:#1b1824;--card:#26223a;--tx:#f1ebf6;--mu:#a9a3bd;--bd:#38314f;--ac:#f19bbb;--onac:#20121f;--s1:#4a2f48;--s2:#2c3e5e;--stx:#f3e9f5;--hv:rgba(255,255,255,.14);--pill:#33415f;--pt:#bcd9f6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden;max-width:100vw;touch-action:pan-y;overscroll-behavior-x:none;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:245px;color:var(--stx);padding:24px 16px;background:linear-gradient(180deg,var(--s1),var(--s2));position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;overflow:auto;z-index:30;transition:transform .25s ease;touch-action:pan-y}
.logo{font-size:24px;font-weight:800;letter-spacing:.2em;padding:4px 6px 20px}.logo small{display:block;font-size:11px;font-weight:500;letter-spacing:.04em;opacity:.75;margin-top:2px}
.nav button{width:100%;padding:11px 13px;background:transparent;color:var(--stx);text-align:left;border-radius:9px;margin:2px 0;opacity:.9}

.content{margin-left:245px;padding:28px;max-width:1500px;width:100%;min-width:0;transition:margin .25s ease}.sc{touch-action:pan-x pan-y}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.top h1{margin:0;font-size:27px}.sub{margin-top:5px;color:var(--mu)}
.primary{background:var(--ac);color:var(--onac);border-radius:9px;padding:11px 16px;font-weight:700}
.secondary{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;font-weight:600}
.danger{background:#fff0f0;color:var(--ko);padding:8px 11px;border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.card,.panel{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 12px #e58ab01f;border:1px solid var(--bd)}
.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 15px}
.card .label{font-size:13px;color:var(--mu)}.card .value{font-size:25px;font-weight:800;margin-top:7px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.trip-head{display:flex;justify-content:space-between;align-items:center}.trip-title{font-size:22px;font-weight:800}
.pill{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pill);color:var(--pt)}
.timeline{border-left:2px solid var(--bd);margin-left:8px;padding-left:20px}
.event{padding:0 0 16px;display:flex;justify-content:space-between;gap:8px}.event strong{display:block}.event span{font-size:13px;color:var(--mu)}
.progress{height:9px;background:var(--bd);border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#f4a6c0,#a9cdf0)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:10px;flex-wrap:wrap}.row span{font-size:13px;color:var(--mu)}
.empty{text-align:center;padding:45px;color:var(--mu)}
table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:13px}th{font-weight:600;color:var(--mu)}
.check{display:flex;align-items:center;gap:8px;padding:8px 0}.check input{width:20px;height:20px}.check .x{margin-left:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;outline:none;background:var(--card);color:var(--tx)}
textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.modal{position:fixed;inset:0;background:#3d3a5c66;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}
.modalbox{background:var(--card);border-radius:15px;padding:22px;max-height:90vh;overflow:auto;width:min(680px,100%)}.modalbox h2{margin-top:0}
.toast{position:fixed;right:25px;bottom:25px;background:var(--s1);color:var(--stx);padding:12px 16px;border-radius:9px;display:none;z-index:30}
.neg{color:var(--ko)}.pos{color:var(--ok)}.mu{color:var(--mu)}.sc{overflow-x:auto}
.pinb{margin-left:auto;background:transparent;color:var(--stx);border-radius:8px;width:32px;height:32px;padding:0;font-size:16px;line-height:1;flex:none;opacity:.55;transform:rotate(35deg);filter:grayscale(.7);transition:.15s}
.pinb.on{background:var(--ac);opacity:1;transform:none;filter:none}
.navtrip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;padding:12px 13px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:7px 13px;font-weight:600;flex:none}
.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
#mtog{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:38px;height:38px;border-radius:10px;background:var(--ac);color:var(--onac);font-size:19px;line-height:1;z-index:40;display:none;box-shadow:0 2px 10px #0003;padding:0}
#bd{position:fixed;inset:0;background:#3d3a5c40;z-index:25;display:none}
body.hid .side{transform:translateX(-105%)}body.hid.peek .side{transform:none;box-shadow:6px 0 24px #0003}
body.hid .content{margin-left:0;padding-top:64px}body.hid #mtog{display:block}body.hid.peek #mtog{opacity:0;pointer-events:none}body.hid.peek #bd{display:block}
@media(max-width:820px){.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.side{width:min(78vw,290px)}
body.hid .content{padding:64px 16px 16px}
body:not(.hid) .side{width:158px;padding:12px 8px}body:not(.hid) .content{margin-left:158px;padding:12px 10px}
body:not(.hid) .logo>div{display:none}body:not(.hid) .logo{padding:2px 0 10px;gap:6px!important}body:not(.hid) .logo svg{width:34px;height:34px}
body:not(.hid) .nav button{font-size:13px;padding:9px 8px}body:not(.hid) .navtrip{padding:10px 8px 2px}}

<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);

let S=null;try{S=JSON.parse(localStorage.getItem('mpv2'))}catch(e){}if(!S||!S.trips)S={trips:[],cur:null};
const save=()=>{try{localStorage.setItem('mpv2',JSON.stringify(S))}catch(e){}if(usr){clearTimeout(dtm);dtm=setTimeout(nuvemSalvar,2500)}};

function ativa(){const a=S.trips.find(x=>x.id===S.cur);if(a&&!conc(a))return a;return S.trips.filter(x=>!conc(x)).sort((x,y)=>(x.ini||'9')<(y.ini||'9')?-1:1)[0]||null}
const trip=()=>pg==='det'?(S.trips.find(t=>t.id===DV)||null):ativa();

const toast=m=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(tm);tm=setTimeout(()=>e.style.display='none',1800)};
const CATS=['Passagens','Hospedagem','Transporte','Combustível','Alimentação','Passeios','Compras','Farmácia','Estacionamento','Internet','Outros'];
const PAG=['Dinheiro','PIX/TED','Cartão de Crédito','Cartão de Débito'],MOE=['BRL','ARS','USD','EUR','CLP','UYU'],ST=['Ideia','Futuro','Planejando','Confirmada','Concluída'];

const M={
viagem:{t:'Viagem',f:[['nome','Destino','text'],['dest','País','text'],['ini','Ida','date'],['fim','Volta','date'],['pessoas','Nº de pessoas','number'],['nomes','Pessoas (nomes)','text'],['orcamento','Orçamento (R$)','number'],['tenho','Já guardado (R$)','number'],['st','Status','sel',ST],['obs','Observação','area']]},
roteiro:{t:'Atividade do roteiro',f:[['dia','Dia','date'],['hora','Hora','time'],['atv','Atividade','text'],['obs','Observações','area']],sort:r=>r.dia+r.hora},
lugares:{t:'Lugar',f:[['nome','Nome','text'],['cat','Categoria','text'],['end','Endereço','text'],['link','Link/Instagram/site','text'],['preco','Preço','number'],['hor','Horário','text'],['tempo','Tempo estimado','text'],['prio','Prioridade','sel',['Alta','Média','Baixa']],['obs','Observações','area'],['vis','Visitado','bool'],['nota','Nota (0-10)','number'],['volta','Voltaria?','sel',['','Sim','Não']],['recom','Recomendaria?','sel',['','Sim','Não']],['paval','Preço foi...','sel',['','Barato','Justo','Caro']]]},

pagtos:{t:'Pagamento',f:[['item','Item','text'],['valor','Valor (R$)','number'],['venc','Vencimento','date'],['st','Status','sel',['Pendente','Pago']],['por','Quem pagou','text']]},
hosp:{t:'Hospedagem',f:[['nome','Hotel','text'],['end','Endereço','text'],['tel','Telefone','text'],['site','Site','text'],['ci','Check-in','date'],['co','Check-out','date'],['hci','Hora check-in','time'],['quarto','Tipo de quarto','text'],['valor','Valor (R$)','number'],['pag','Forma pgto','sel',PAG],['cod','Código da reserva','text'],['obs','Cancelamento / café / estacionamento','area']]},
trans:{t:'Passagem/transporte',f:[['trecho','Trecho','text'],['cia','Companhia','text'],['loc','Localizador','text'],['data','Data','date'],['hora','Horário','time'],['assento','Assento','text'],['bag','Bagagem','text'],['valor','Valor (R$)','number']]},
docs:{t:'Documento',fl:1,f:[['nome','Documento','text'],['tipo','Tipo','sel',['Passagem','Reserva','Ingresso','Voucher','Seguro','Aluguel de carro','Comprovante','Outro']],['onde','Link / onde está o arquivo','text']]},
check:{t:'Item do checklist',f:[['item','Item','text'],['grupo','Grupo','sel',['Documentos','Eletrônicos','Roupas','Higiene','Outros']],['ok','Pronto','bool']]},
compras:{t:'Compra',f:[['item','Item','text'],['qtd','Quantidade','number'],['preco','Preço unitário','number'],['ok','Comprado','bool']],c:[['Total',r=>R((+r.qtd||1)*(+r.preco||0))]]},
carro:{t:'Registro do carro',f:[['data','Data','date'],['tipo','Tipo','sel',['Abastecimento','Pedágio','Estacionamento','Outro']],['litros','Litros','number'],['valor','Valor (R$)','number'],['km','KM do odômetro','number']]},
dia:{t:'Registro do diário',fl:1,f:[['data','Data','date'],['lugar','Lugar','text'],['txt','O que fizemos / momentos favoritos','area'],['comeu','Onde comemos','text'],['nota','Nota do dia (0-10)','number']]},
mapa:{t:'Ponto do mapa',f:[['nome','Local','text'],['tipo','Tipo','sel',['Hotel','Restaurante','Passeio','Aeroporto','Estacionamento','Outro']],['end','Endereço','text'],['lat','Latitude','number'],['lon','Longitude','number'],['dia','Dia (opcional)','date']]}};

const MODS=['roteiro','lugares','fin','pagtos','hosp','trans','check','compras','carro','docs','dia','mapa','aval','poup'];
const ORD=['ini','viagens','roteiro','lugares','fin','pagtos','hosp','trans','check','compras','carro','docs','dia','mapa','aval','poup','cfg','nuvem'];
P.sort((a,b)=>ORD.indexOf(a[0])-ORD.indexOf(b[0]));
const DEF=[['Documentos','RG','CNH','Cartões','Dinheiro','Seguro viagem','Passaporte'],['Eletrônicos','Celular','Carregador','Power bank','Fones'],['Roupas','Roupas','Pijama','Roupa íntima','Casaco','Calçados'],['Higiene','Protetor solar','Remédios','Necessaire']];
const rows=k=>k==='viagem'?S.trips:(trip().d[k]=trip().d[k]||[]);
const tot=(t,k,f)=>(t.d[k]||[]).reduce((a,r)=>a+(+f(r)||0),0);
const dias=d=>d?Math.ceil((new Date(d+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5):null;
const inp=(f,v)=>{const[k,,ty,o]=f,i=`id="m_${k}"`;
if(ty==='sel')return`<select ${i}>${o.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('')}</select>`;

function verM(k,id){const m=M[k],x=rows(k).find(r=>r.id===id);if(!x)return;
const L=[...m.f.map(f=>[f[1],fmtV(f,x)]),...(m.c||[]).map(c=>[c[0],c[1](x)])].filter(a=>a[1]!==''),tt=x.nome||x.item||x.atv||x.desc0||x.trecho||x.lugar||x.tipo||m.t;
$('#mc').innerHTML=`<h2>${esc(tt)}</h2><p class="sub" style="margin:-8px 0 14px">${m.t}</p><div class="list">${L.map(a=>`<div class="row" style="align-items:flex-start"><b style="min-width:130px">${a[0]}</b><span style="flex:1;color:var(--tx);font-size:14px;text-align:right;overflow-wrap:anywhere">${a[1]}</span></div>`).join('')||'<span class="mu">Sem informações.</span>'}</div>${(x.files||[]).length?`<div style="margin-top:12px"><b style="font-size:12px">Anexos</b><div>${fl(x)}</div></div>`:''}<div class="actions"><button class="secondary" onclick="closeM()">Fechar</button><button class="primary" onclick="closeM();openM('${k}','${id}')">✎ Editar</button></div>`;$('#modal').classList.add('open');hyd()}

const SB_URL='https://mzdzjbqjfndbkfouyngh.supabase.co',SB_KEY='sb_publishable_8KK5Cu2CyJByLjT7rB_Q5g_k7z9VCEK';

usr=r.data.user;await sbSync();draw()}

if(!r.data){if(S.trips.length)await nuvemSalvar();else dst='Conectado. Nada salvo ainda.'}

else dst='Conectado. Já existem dados na nuvem e neste aparelho: use "Enviar agora" ou "Restaurar da nuvem".';syncAnexos().catch(()=>{})}

<div class="panel"><h2>2. Sua conta</h2>${usr?`<p class="sub">Conectado como <b>${esc(usr.email)}</b>. Cada alteração é enviada automaticamente.</p><div class="actions" style="justify-content:flex-start"><button class="primary" onclick="nuvemSalvar();syncAnexos(true)">☁️ Enviar agora</button><button class="secondary" onclick="nuvemRestaurar()">Restaurar da nuvem</button><button class="secondary" onclick="sair()">Sair</button></div>`:`<div class="form"><div><label>E-mail</label><input id="em" type="email"></div><div><label>Senha</label><input id="pw" type="password"></div></div><div class="actions" style="justify-content:flex-start"><button class="primary" onclick="sbAuth('in')">Entrar</button><button class="secondary" onclick="sbAuth('up')">Criar conta</button></div>`}<p class="sub">${esc(dst)}</p><p class="sub">Fotos e PDFs anexados também são enviados para a nuvem, em uma pasta privada da sua conta (fotos grandes são reduzidas para economizar espaço).</p></div>
<div class="panel"><h2>Backup manual (texto)</h2><p class="sub">Copie o texto para guardar uma cópia ou cole um backup para importar.</p><textarea id="bk">${esc(JSON.stringify(S))}</textarea><div class="actions"><button class="secondary" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#bk').value)">Copiar</button><button class="primary" onclick="imp()">Importar</button></div></div>`}
const FIX=['ini','cfg'],hids=()=>((S.cfg||{}).hide)||[],vis=id=>FIX.includes(id)||!hids().includes(id);
function cfgTog(id,on){S.cfg=S.cfg||{};const h=hids().filter(x=>x!==id);S.cfg.hide=on?h:[...h,id];if(!vis(pg))pg='ini';save();draw()}
function cfgAll(on){S.cfg=S.cfg||{};S.cfg.hide=on?[]:P.map(p=>p[0]).filter(i=>!FIX.includes(i));save();draw()}
function cfgPg(){return`<div class="panel"><h2>Botões do menu</h2><p class="sub">Marque os que devem aparecer. <b>Início</b> e <b>Configurações</b> ficam sempre visíveis. Ocultar um botão não apaga nenhum dado, e a escolha é salva na sua conta. Os botões da viagem (Roteiro, Lugares, Financeiro etc.) aparecem só para a viagem que não está concluída; as concluídas abrem em <b>Minhas viagens</b>.</p><div class="list" style="margin-top:12px">${P.filter(p=>!FIX.includes(p[0])).map(p=>`<label class="row" style="margin:0;cursor:pointer;font-size:14px;font-weight:600"><span style="color:var(--tx)">${p[1]} &nbsp; ${p[2]}</span><input type="checkbox" style="width:22px;height:22px" ${vis(p[0])?'checked':''} onchange="cfgTog('${p[0]}',this.checked)"></label>`).join('')}</div><div class="actions" style="justify-content:flex-start"><button class="secondary" onclick="cfgAll(true)">Mostrar todos</button><button class="secondary" onclick="cfgAll(false)">Ocultar todos</button></div></div>`}

const at=ativa();let lab=false;
$('#nav').innerHTML=P.filter(p=>vis(p[0])&&(!MODS.includes(p[0])||at)).map(p=>{let pre='';if(MODS.includes(p[0])&&!lab){lab=true;pre=`<div class="navtrip">✈️ ${esc(at.nome)}</div>`}return pre+`<button class="${p[0]===pg||(pg==='det'&&p[0]==='viagens')?'active':''}" onclick="pg='${p[0]}';navPick();draw();scrollTo(0,0)">${p[1]} &nbsp; ${p[2]}</button>`}).join('');
const m=$('#main');
if(pg==='det'){const t=trip(),keys=['ini','roteiro','lugares','fin','pagtos','hosp','trans','check','compras','carro','docs','dia','mapa','aval',...(conc(t)?[]:['poup'])];if(!keys.includes(dtab))dtab='ini';

m.innerHTML=`<div class="top"><div><button class="secondary" onclick="pg='viagens';draw();scrollTo(0,0)">← Minhas viagens</button><h1 style="margin-top:12px">✈️ ${esc(t.nome)} <span class="pill" style="vertical-align:middle">${esc(t.st)}</span></h1><div class="sub">${[t.dest,t.ini||t.fim?`${fD(t.ini)} → ${fD(t.fim)}`:'',t.pessoas+' pessoa(s)'].filter(Boolean).map(esc).join(' · ')}</div>${t.nomes?`<div class="sub">👥 ${esc(t.nomes)}</div>`:''}${t.obs?`<div class="sub" style="white-space:pre-wrap">📝 ${esc(t.obs)}</div>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="openM('viagem','${t.id}')">✎ Editar viagem</button>${pk&&pk[5]&&dtab!=='ini'?`<button class="primary" onclick="openM('${pk[5]}')">＋ ${pk[6]}</button>`:''}</div></div><div class="chips sc">${chips}</div>${pageBody(dtab,t)}`;hyd();return}
const p=P.find(x=>x[0]===pg),t=trip();let b;

else b=pageBody(pg,t);

const isMob=()=>matchMedia('(max-width:820px)').matches;
