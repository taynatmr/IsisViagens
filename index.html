<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ISIS — Planner de Viagens</title>
<style>
:root{--bg:#fdf6fa;--card:#fff;--tx:#3d3a5c;--mu:#7a7896;--bd:#f1e1ea;--ac:#e58ab0;--onac:#3d2a4a;--s1:#f8c8dc;--s2:#bcd9f6;--stx:#3d3a5c;--hv:rgba(255,255,255,.65);--pill:#e3effc;--pt:#3b6ea5;--ok:#2b8a3e;--ko:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1824;--card:#26223a;--tx:#f1ebf6;--mu:#a9a3bd;--bd:#38314f;--ac:#f19bbb;--onac:#20121f;--s1:#4a2f48;--s2:#2c3e5e;--stx:#f3e9f5;--hv:rgba(255,255,255,.14);--pill:#33415f;--pt:#bcd9f6}}
:root[data-theme="dark"]{--bg:#1b1824;--card:#26223a;--tx:#f1ebf6;--mu:#a9a3bd;--bd:#38314f;--ac:#f19bbb;--onac:#20121f;--s1:#4a2f48;--s2:#2c3e5e;--stx:#f3e9f5;--hv:rgba(255,255,255,.14);--pill:#33415f;--pt:#bcd9f6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden;max-width:100vw;touch-action:pan-y;overscroll-behavior-x:none;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:245px;color:var(--stx);padding:24px 16px;background:linear-gradient(180deg,var(--s1),var(--s2));position:fixed;top:env(safe-area-inset-top,0px);bottom:0;left:0;overflow:auto;z-index:30;transition:transform .25s ease;touch-action:pan-y}
.logo{font-size:24px;font-weight:800;letter-spacing:.2em;padding:4px 6px 20px}.logo small{display:block;font-size:11px;font-weight:500;letter-spacing:.04em;opacity:.75;margin-top:2px}
.nav button{width:100%;padding:11px 13px;background:transparent;color:var(--stx);text-align:left;border-radius:9px;margin:2px 0;opacity:.9}
.nav button:hover,.nav button.active{background:var(--hv);opacity:1}.nav button.active{font-weight:700}
.content{margin-left:245px;padding:28px;max-width:1500px;width:100%;min-width:0;transition:margin .25s ease}.sc{touch-action:pan-x pan-y}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}
.top h1{margin:0;font-size:27px}.sub{margin-top:5px;color:var(--mu)}
.primary{background:var(--ac);color:var(--onac);border-radius:9px;padding:11px 16px;font-weight:700}
.secondary{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 12px;font-weight:600}
.danger{background:#fff0f0;color:var(--ko);padding:8px 11px;border-radius:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.card,.panel{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 12px #e58ab01f;border:1px solid var(--bd)}
.panel{padding:20px;margin-bottom:18px}.panel h2{font-size:17px;margin:0 0 15px}
.card .label{font-size:13px;color:var(--mu)}.card .value{font-size:25px;font-weight:800;margin-top:7px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.trip-head{display:flex;justify-content:space-between;align-items:center}.trip-title{font-size:22px;font-weight:800}
.pill{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pill);color:var(--pt)}
.timeline{border-left:2px solid var(--bd);margin-left:8px;padding-left:20px}
.event{padding:0 0 16px;display:flex;justify-content:space-between;gap:8px}.event strong{display:block}.event span{font-size:13px;color:var(--mu)}
.progress{height:9px;background:var(--bd);border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#f4a6c0,#a9cdf0)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:10px;flex-wrap:wrap}.row span{font-size:13px;color:var(--mu)}
.empty{text-align:center;padding:45px;color:var(--mu)}
table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:13px}th{font-weight:600;color:var(--mu)}
.check{display:flex;align-items:center;gap:8px;padding:8px 0}.check input{width:20px;height:20px}.check .x{margin-left:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;outline:none;background:var(--card);color:var(--tx)}
textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.modal{position:fixed;inset:0;background:#3d3a5c66;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}
.modalbox{background:var(--card);border-radius:15px;padding:22px;max-height:90vh;overflow:auto;width:min(680px,100%)}.modalbox h2{margin-top:0}
.toast{position:fixed;right:25px;bottom:25px;background:var(--s1);color:var(--stx);padding:12px 16px;border-radius:9px;display:none;z-index:30}
.neg{color:var(--ko)}.pos{color:var(--ok)}.mu{color:var(--mu)}.sc{overflow-x:auto}
.pinb{margin-left:auto;background:transparent;color:var(--stx);border-radius:8px;width:32px;height:32px;padding:0;font-size:16px;line-height:1;flex:none;opacity:.55;transform:rotate(35deg);filter:grayscale(.7);transition:.15s}
.pinb.on{background:var(--ac);opacity:1;transform:none;filter:none}
.navtrip{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;padding:12px 13px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlay{display:grid;grid-template-columns:215px 1fr;gap:18px;align-items:start}.vnav{position:sticky;top:12px;display:flex;flex-direction:column;gap:6px}.vdm{display:none}
.vi{display:flex;gap:4px;align-items:stretch}.vi .chip{flex:1;border-radius:12px;text-align:left;display:flex;justify-content:space-between;gap:8px;white-space:normal;align-items:center}.vi .bd{font-size:11px;opacity:.7;font-weight:700}.side .vi{display:flex;gap:2px}.side .vi .bd{font-size:11px;opacity:.7}.vi .hx{background:transparent;color:var(--mu);padding:0 8px;border-radius:10px;font-size:12px}
.vdm summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;font-weight:700}.vdm[open] summary{margin-bottom:8px}.vdm .vnav{position:static}
@media(max-width:820px){.vlay{grid-template-columns:1fr}.vlay>.vnav{display:none}.vdm{display:block}}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.tc{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}.tc:hover{transform:translateY(-2px);box-shadow:0 6px 18px #e58ab022}
.cv{height:135px;background:linear-gradient(135deg,var(--s1),var(--s2)) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px}.tc .tb{padding:12px 14px}.tc .tn{font-weight:800;font-size:16px}.tc .ts{font-size:12px;color:var(--mu);margin-top:3px}
.hero{height:170px;border-radius:14px;margin-bottom:14px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:4px}.gg .fl{display:block;aspect-ratio:1;overflow:hidden;border-radius:6px;background:var(--bd)}.gg .fl img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;margin:0!important;border-radius:0!important}
.fl img.gimg{cursor:zoom-in}
#gal{position:fixed;inset:0;background:#000e;z-index:60;display:none;align-items:center;justify-content:center;touch-action:pan-y}#gal.open{display:flex}#gal img{max-width:100vw;max-height:86vh;object-fit:contain;user-select:none}
#gal button{position:absolute;background:#ffffff26;color:#fff;border-radius:50%;width:44px;height:44px;font-size:22px}#gal .gx{top:calc(14px + env(safe-area-inset-top,0px));right:14px}#gal .gp{left:10px;top:50%}#gal .gn{right:10px;top:50%}#gal .gc{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:13px;padding:0 60px}
.pk label{display:flex;gap:10px;align-items:center;padding:7px 2px;font-weight:600;font-size:14px}.pk input{width:20px;height:20px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:7px 13px;font-weight:600;flex:none}
.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
#mtog{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;width:38px;height:38px;border-radius:10px;background:var(--ac);color:var(--onac);font-size:19px;line-height:1;z-index:40;display:none;box-shadow:0 2px 10px #0003;padding:0}
#bd{position:fixed;inset:0;background:#3d3a5c40;z-index:25;display:none}
body.hid .side{transform:translateX(-105%)}body.hid.peek .side{transform:none;box-shadow:6px 0 24px #0003}
body.hid .content{margin-left:0;padding-top:64px}body.hid #mtog{display:block}body.hid.peek #mtog{opacity:0;pointer-events:none}body.hid.peek #bd{display:block}
@media(max-width:820px){.grid{grid-template-columns:1fr}.top{flex-wrap:wrap}.side{width:min(78vw,290px)}
body.hid .content{padding:64px 16px 16px}
body:not(.hid) .side{width:158px;padding:12px 8px}body:not(.hid) .content{margin-left:158px;padding:12px 10px}
body:not(.hid) .logo>div{display:none}body:not(.hid) .logo{padding:2px 0 10px;gap:6px!important}body:not(.hid) .logo svg{width:34px;height:34px}
body:not(.hid) .nav button{font-size:13px;padding:9px 8px}body:not(.hid) .navtrip{padding:10px 8px 2px}}

.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px}.dgrid .panel{margin-bottom:0}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bar .lb{width:120px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;background:var(--bd);border-radius:7px;height:14px;overflow:hidden;min-width:30px}.bar .tr i{display:block;height:100%;border-radius:7px}
.bar .vl{min-width:78px;text-align:right;font-weight:700;font-size:12px}.bar.rk .lb{width:150px;font-weight:600}
.leg{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:140px;flex:1}.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px}.leg b{float:right;margin-left:10px}
.cols{display:flex;align-items:flex-end;gap:8px;height:200px;overflow-x:auto;padding-top:6px}.col{flex:1;min-width:46px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.col .cb{width:66%;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#e58ab0,#a9cdf0)}.col .cv{font-size:11px;font-weight:700;margin-bottom:3px}.col .cl{font-size:11px;color:var(--mu);margin-top:5px;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}.mini div{background:var(--bg);border-radius:10px;padding:10px}.mini small{color:var(--mu);display:block;font-size:11px}.mini b{font-size:15px}

function xDate(v){if(v===''||v==null)return'';if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const t=String(v).trim();let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return''}

${d.trans.length?Pn('🎫 Passagens e transportes',lst(d.trans.map(x=>`<div class="row"><div><b>${esc([x.de,x.para].filter(Boolean).join(' → '))}</b><br><span>${[x.viaj,x.cia,fD(x.data),x.hora].filter(Boolean).map(esc).join(' · ')}</span></div><b>${x.valor?R(x.valor):''}</b></div>`))):''}
${d.pagtos.length?Pn('💳 Pagamentos',`<div class="row"><span>Pago</span><b class="pos">${R(pago)}</b></div><div class="row"><span>Falta pagar</span><b class="${falta?'neg':''}">${R(falta)}</b></div>`):''}
${d.check.length||d.compras.length?Pn('🧳 Preparativos',(d.check.length?`<div class="row"><span>Checklist</span><b>${ck} / ${d.check.length}</b></div><div class="bar"><span class="tr"><i style="width:${ck/d.check.length*100}%;background:var(--ac)"></i></span></div>`:'')+(d.compras.length?`<div class="row"><span>Compras</span><b>${cp} / ${d.compras.length}</b></div>`:'')):''}
${d.carro.length?Pn('🚗 Carro',`<div class="row"><span>Custo</span><b>${R(tot(t,'carro',r=>r.valor))}</b></div><div class="row"><span>Rodados</span><b>${km} km</b></div>`):''}
${d.docs.length?Pn('📄 Documentos',lst(d.docs.map(x=>`<div class="row"><span>${esc(x.nome||x.tipo)}</span><span class="pill">${esc(x.tipo||'')}</span></div>`))):''}
</div>
${d.dia.length?`<div class="panel" data-g style="margin-top:16px"><h2>📸 Memórias <small class="mu">(${d.dia.length} registro(s))</small></h2>${ph.length?`<div class="gg">${d.dia.flatMap(x=>(x.files||[]).filter(f=>/\.(jpe?g|png|gif|webp|heic|heif|avif|bmp)$/i.test(f.name)).map(f=>`<span class="fl gi" data-f="${f.id}" data-n="${esc((fD(x.data)+' '+(x.lugar||'')).trim()||f.name)}"></span>`)).slice(0,12).join('')}</div>`:''}${lst([...d.dia].sort((a,b)=>a.data<b.data?1:-1).slice(0,3).map(x=>`<div class="row" style="cursor:pointer" onclick="verM('dia','${x.id}')"><div><b>${fD(x.data)} ${esc(x.lugar)}</b><br><span>${esc(String(x.txt||'').slice(0,90))}</span></div><b>${x.nota?'⭐ '+esc(x.nota):''}</b></div>`))}</div>`:''}`}
function pageBody(k,t){return({ini,roteiro,lugares,fin,pagtos,check,dia,carro,poup,docs,aval}[k]?.(t))||(k==='compras'?`<div class="cards">${C('Total estimado',R(tot(t,'compras',r=>(+r.qtd||1)*(+r.preco||0))))}</div>`+tbl('compras'):tbl(k))}
function draw(){if(pg==='det'&&!S.trips.find(x=>x.id===DV))pg='viagens';
const at=ativa();let lab=false;
const dt=pg==='det'?trip():null,oc0=dt?(dt.oculta||[]):[],all0=dt?['ini','roteiro','lugares','fin','pagtos','trans','check','compras','carro','docs','dia',...(conc(dt)?[]:['poup'])]:[];if(dt&&!all0.concat('cfgv').includes(dtab))dtab='ini';
const lab0=k=>k==='ini'?['🏠','Resumo']:[P.find(x=>x[0]===k)[1],P.find(x=>x[0]===k)[2]];
const tripNav=dt?`<div class="navtrip">✈️ ${esc(dt.nome)}</div>`+all0.filter(k=>k==='ini'||!oc0.includes(k)||k===dtab).map(k=>{const e=lab0(k),c=secCnt(dt,k);return`<button class="${k===dtab?'active':''}" style="display:flex;justify-content:space-between" onclick="dtab='${k}';navPick();draw();scrollTo(0,0)"><span>${e[0]} &nbsp; ${e[1]}</span>${c?`<span class="bd">${c}</span>`:''}</button>`}).join('')+`<button class="${dtab==='cfgv'?'active':''}" onclick="dtab='cfgv';navPick();draw();scrollTo(0,0)">⚙️ &nbsp; Config. da viagem</button>`:'';
$('#nav').innerHTML=P.filter(p=>vis(p[0])&&!MODS.includes(p[0])).map(p=>`<button class="${p[0]===pg||(pg==='det'&&p[0]==='viagens')?'active':''}" onclick="pg='${p[0]}';navPick();draw();scrollTo(0,0)">${p[1]} &nbsp; ${p[2]}</button>`+(p[0]==='viagens'?tripNav:'')).join('');
const m=$('#main');
if(pg==='det'){const t=trip();(t.d.trans||[]).forEach(x=>{if(x.trecho&&!x.de){x.de=x.trecho;delete x.trecho}});
const pk=P.find(x=>x[0]===dtab);
m.innerHTML=`<div class="top"><div><button class="secondary" onclick="pg='viagens';draw();scrollTo(0,0)">← Minhas viagens</button><h1 style="margin-top:12px">✈️ ${esc(t.nome)} <span class="pill" style="vertical-align:middle">${esc(t.st)}</span></h1><div class="sub">${[t.dest,t.ini||t.fim?`${fD(t.ini)} → ${fD(t.fim)}`:'',t.pessoas+' pessoa(s)'+(cn(t)!==t.pessoas?' · conta dividida em '+cn(t):'')].filter(Boolean).map(esc).join(' · ')}</div>${t.nomes?`<div class="sub">👥 ${esc(t.nomes)}</div>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="ieOpen('imp','${t.id}')">⬆ Importar</button><button class="secondary" onclick="ieOpen('exp','${t.id}')">⬇ Exportar</button><button class="secondary" onclick="openM('viagem','${t.id}')">✎ Editar viagem</button><button class="danger" onclick="delViagem('${t.id}')">🗑 Excluir viagem</button>${pk&&pk[5]&&dtab!=='ini'?`<button class="primary" onclick="openM('${pk[5]}')">＋ ${pk[6]}</button>`:''}</div></div><div style="min-width:0">${dtab==='ini'?resumo(t):dtab==='cfgv'?cfgViagem(t):pageBody(dtab,t)}</div>`;hyd();return}
const p=P.find(x=>x[0]===pg),t=trip();let b;
if(pg==='cfg')b=cfgPg();else if(pg==='viagens')b=viagens();else if(pg==='nuvem')b=nuvem();
else if(!t)b=S.trips.length?`<div class="panel empty">🌴<br><br>Nenhuma viagem em andamento.<br><small>Viagens concluídas ficam em Minhas viagens.</small><div class="actions" style="justify-content:center"><button class="secondary" onclick="pg='viagens';draw()">Minhas viagens</button><button class="primary" onclick="openM('viagem')">＋ Nova viagem</button></div></div>`:`<div class="panel empty">✈️<br><br>Crie sua primeira viagem para começar.<div class="actions" style="justify-content:center"><button class="primary" onclick="openM('viagem')">＋ Nova viagem</button></div></div>`;
else b=pageBody(pg,t);
const ok=p[5]&&(t||p[5]==='viagem');
if(pg==='ini')b+=dash();
m.innerHTML=`<div class="top"><div><h1>${p[3]}</h1><div class="sub">${p[4]}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${pg==='ini'&&t?`<button class="secondary" onclick="ieOpen('imp','${t.id}')">⬆ Importar</button><button class="secondary" onclick="ieOpen('exp','${t.id}')">⬇ Exportar</button>`:''}${ok?`<button class="primary" onclick="openM('${p[5]}')">＋ ${p[6]}</button>`:''}</div></div>${b}`;hyd()}

const isMob=()=>matchMedia('(max-width:820px)').matches;
function menuApply(){const h=document.body.classList.contains('hid'),b=$('#pinb');if(b){b.classList.toggle('on',!h);b.setAttribute('aria-pressed',String(!h));b.title=h?'Fixar menu':'Menu fixado: clique para desafixar'}}
function menuInit(){let h;try{h=localStorage.getItem('isis_menu')}catch(e){}if(h!=='pin'&&h!=='hid')h=isMob()?'hid':'pin';document.body.classList.toggle('hid',h==='hid');document.body.classList.remove('peek');menuApply()}
function menuSave(){try{localStorage.setItem('isis_menu',document.body.classList.contains('hid')?'hid':'pin')}catch(e){}}
function pinTog(){const c=document.body.classList;if(c.contains('hid')){c.remove('hid','peek')}else{c.add('hid');c.remove('peek')}menuSave();menuApply()}
function peek(v){if(document.body.classList.contains('hid'))document.body.classList.toggle('peek',!!v)}
function peekTog(){peek(!document.body.classList.contains('peek'))}
function bdClick(){document.body.classList.remove('peek')}
function navPick(){document.body.classList.remove('peek')}
const canHover=()=>matchMedia('(hover:hover)').matches;
let ptm;document.querySelector('.side').addEventListener('mouseleave',()=>{if(!canHover())return;clearTimeout(ptm);ptm=setTimeout(()=>peek(0),250)});
document.querySelector('.side').addEventListener('mouseenter',()=>clearTimeout(ptm));
document.getElementById('mtog').addEventListener('mouseleave',()=>{if(!canHover())return;clearTimeout(ptm);ptm=setTimeout(()=>peek(0),400)});
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault(),{passive:false}));
document.addEventListener('touchmove',x=>{if(x.touches.length>1)x.preventDefault()},{passive:false});
document.addEventListener('dblclick',x=>x.preventDefault());
menuInit();
draw();sbBoot();
</script></body></html>
